name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: فحص الجودة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: التحقّق من الأنواع
        run: npm run typecheck

      - name: ESLint
        run: npx eslint .

      - name: الاختبارات
        run: npm test

      - name: البناء
        run: npx vite build
