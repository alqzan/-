<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS يتجاهل أيقونات SVG عند «إضافة إلى الشاشة الرئيسية» ويضع لقطة
         من الصفحة مكانها، فلا بدّ من PNG بمقاس ١٨٠ صراحةً. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- بلا maximum-scale/user-scalable: منع التكبير يعيق القراءة، وأمٌّ متعبة
         في الثالثة فجرًا تحتاج تكبير النص أكثر من أي أحد. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F3EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="طفلنا — حكاية طفلكم موثّقة من أول أسبوع: صور، رسائل، ولحظات أولى" />
    <title>طفلنا</title>
    <link
      rel="preload"
      href="/fonts/thmanyahsans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/thmanyahserifdisplay-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
