  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <g fill="none" stroke="#A9532A" stroke-linecap="round">
      <path d="M96 368c0-88 72-160 160-160s160 72 160 160" stroke-width="20"/>
      <path d="M154 368c0-56 46-102 102-102s102 46 102 102" stroke-width="20" opacity="0.6"/>
      <path d="M212 368c0-24 20-44 44-44s44 20 44 44" stroke-width="20" opacity="0.32"/>
    </g>
    <circle cx="256" cy="146" r="28" fill="#A9532A"/>
  </g>
</svg>
