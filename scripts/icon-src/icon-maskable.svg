<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    نسخة maskable: أندرويد يقصّ الأيقونة بأشكال مختلفة (دائرة، مربّع مدوّر…)
    ويضمن ظهور الـ ٨٠٪ الوسطى فقط. لذلك نُصغّر الرسم إلى ٧٠٪ حول المركز
    ونمدّ الخلفية إلى الحوافّ — فلا يُقصّ طرف قوس مهما كان شكل القناع.
  -->
